<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloverbank Farm</title><link rel="stylesheet" href="style.css"><script defer src="game.js"></script></head>
<body><main><header><p class="eyebrow">A LITTLE FARM BY THE RIVER</p><h1>Cloverbank Farm</h1><p>Grow turnips, meet Fern, and bring the old farm back to life.</p></header>
<section aria-label="Farm"><div id="stats"></div><canvas id="farm" width="480" height="288" aria-label="Farm map"></canvas><p id="message" role="status"></p></section>
<div class="controls"><div aria-label="Movement"><button data-move="0,-1" aria-label="Up">↑</button><button data-move="-1,0" aria-label="Left">←</button><button data-move="0,1" aria-label="Down">↓</button><button data-move="1,0" aria-label="Right">→</button></div><div><button id="act">Use / Talk</button><button id="buy">Buy seeds · 3g</button><button id="sleep">Sleep</button></div></div>
<footer>Move with arrows or WASD. Face a garden plot and press Space to plant, water, or harvest. Harvests sell automatically. Sleep advances the day. Your farm saves in this browser.</footer></main></body></html>
